name: Publish Paw Diary
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'src/**'
      - 'assets/**'
      - '.nojekyll'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p public-site
          cp index.html style.css app.js .nojekyll public-site/
          cp -R assets public-site/assets
          if [ -d src ]; then cp -R src public-site/src; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
